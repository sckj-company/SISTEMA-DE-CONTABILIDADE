services:
  - type: web
    name: sistema-contabilidade-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: virginia
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app"
      - key: GROQ_API_KEY
        sync: false
